# PostgreSQL só para desenvolvimento. A implantação de produção entra na F10.
name: chicochat

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copie .env.example para .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copie .env.example para .env}
      POSTGRES_DB: ${POSTGRES_DB:?Copie .env.example para .env}
    ports:
      # Só no loopback: o banco não deve ficar exposto na rede.
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    volumes:
      - chico_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chico_pgdata:
